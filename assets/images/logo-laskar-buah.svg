<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110" fill="none">
  <!-- Outer chevron triangle: Yellow -->
  <polygon points="90,4 28,74 48,74 90,26 132,74 152,74" fill="#fde000" stroke="#111827" stroke-width="2" stroke-linejoin="round" />
  <!-- Middle chevron: Green -->
  <polygon points="90,28 50,74 68,74 90,48 112,74 130,74" fill="#22a047" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Inner chevron: Red -->
  <polygon points="90,50 70,74 110,74" fill="#ef3b3b" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Text "Laskar Buah" with crisp dark outline and yellow fill -->
  <text
    x="90"
    y="98"
    text-anchor="middle"
    font-family="Arial Black, Impact, sans-serif"
    font-size="25"
    font-weight="900"
    fill="#fde000"
    stroke="#111827"
    stroke-width="4"
    paint-order="stroke"
    letter-spacing="-0.5"
  >Laskar Buah</text>
</svg>
